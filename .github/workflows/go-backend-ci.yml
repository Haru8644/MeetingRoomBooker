name: go-backend-ci

on:
  pull_request:
    branches: [master]
    paths:
      - 'backend/**'
      - '.github/workflows/go-backend-ci.yml'
  push:
    branches: [master]
    paths:
      - 'backend/**'
      - '.github/workflows/go-backend-ci.yml'

permissions:
  contents: read

jobs:
  test:
    name: Test Go backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache: false
      - run: go test -v ./...
        working-directory: backend

  postgres:
    name: Test Go backend with PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci_test
          POSTGRES_PASSWORD: ci_test
          POSTGRES_DB: meetingroombooker_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U ci_test -d meetingroombooker_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache: false
      - name: Run PostgreSQL integration tests
        working-directory: backend
        env:
          TZ: Asia/Tokyo
          POSTGRES_TEST_DATABASE_URL: postgres://ci_test:ci_test@127.0.0.1:${{ job.services.postgres.ports[5432] }}/meetingroombooker_test?sslmode=disable
        run: bash scripts/test-postgres.sh
